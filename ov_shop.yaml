name: OV_SHOP
# Disc file #225 (LBA 5669, 28 sectors): the Element shop and the smith.
# Loaded at 0x801D2800 (slot B, where the menu goes) on top of the field engine.
# Its rodata repeats format strings at 0x801DF778, so it may be two objects.
# Extract it with: tools/extract_files.py <disc1.bin> iso/files 225
sha1: 53aefadb0fa980d295fc75c0db1cd85d6cdfd68e
options:
  basename: ov_shop
  target_path: iso/files/0225.bin
  elf_path: build/ov_shop.elf
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_shop
  src_path: src/ov_shop
  build_path: build

  ld_script_path: linker_scripts/ov_shop.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  # code first, then rodata (strings + jump tables), then data
  section_order: [".text", ".rodata", ".data", ".bss"]

  # Main-EXE symbols (so calls into main get the same names), plus our own.
  symbol_addrs_path:
    - symbol_addrs.txt
    - symbol_addrs_ov_shop.txt

  undefined_funcs_auto_path: linker_scripts/ov_shop_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_shop_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_shop
    type: code
    start: 0x0
    vram: 0x801D2800
    subsegments:
      # header word (0xc) before the first function (named per overlay: splat
      # writes textbin bytes to assets/<name>.textbin.bin)
      - [0x0, textbin, shop_header]
      - [0x4, c, shop_801D2804]
      # strings and jump tables of the code
      - [0xCC10, .rodata, shop_801D2804]
      - [0xD504, data, data_801DFD04]
  - [0xE000]
