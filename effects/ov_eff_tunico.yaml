name: OV_EFF_TUNICO
# Battle effect program tunico.prg (dev name from the Radical Dreamers Edition), disc file
# #4932. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x34).
# The same bytes are also files #4935. Generated by tools/mkeffects.py.
sha1: 7680df97455599ae298cbc13395a6cc7ea9e34ab
options:
  basename: ov_eff_tunico
  target_path: iso/files/4932.bin
  elf_path: build/ov_eff_tunico.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_tunico
  src_path: src/ov_eff_tunico
  build_path: build

  ld_script_path: linker_scripts/ov_eff_tunico.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_tunico_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_tunico_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_tunico
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, rodata, rodata_801C5E00]  # effect id
      - [0x4, c, tunico_801C5E04]
      - [0xaa4, data, data_801C68A4]
  - [0x1800]
