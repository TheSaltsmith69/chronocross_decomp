name: OV_EFF_HINSI
# Battle effect program hinsi.prg (dev name from the Radical Dreamers Edition), disc file
# #5436. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x26).
# The same bytes are also files #5457, #5460, #5763, #5781, #5808, #5856. Generated by tools/mkeffects.py.
sha1: 2e3d13b1c2c15cf52bcf28cf194682f3d37d043c
options:
  basename: ov_eff_hinsi
  target_path: iso/files/5436.bin
  elf_path: build/ov_eff_hinsi.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_hinsi
  src_path: src/ov_eff_hinsi
  build_path: build

  ld_script_path: linker_scripts/ov_eff_hinsi.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_hinsi_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_hinsi_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_hinsi
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, rodata, rodata_801C5E00]  # effect id
      - [0x4, c, hinsi_801C5E04]
      - [0x118, data, data_801C5F18]
  - [0x800]
