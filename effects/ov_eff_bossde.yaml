name: OV_EFF_BOSSDE
# Battle effect program bossde.prg (dev name from the Radical Dreamers Edition), disc file
# #4695. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x14).
# The same bytes are also files #4761, #5439. Generated by tools/mkeffects.py.
sha1: 307c89a94f1b6030ff70e0a3c5114e67b7879153
options:
  basename: ov_eff_bossde
  target_path: iso/files/4695.bin
  elf_path: build/ov_eff_bossde.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_bossde
  src_path: src/ov_eff_bossde
  build_path: build

  ld_script_path: linker_scripts/ov_eff_bossde.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_bossde_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_bossde_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_bossde
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, rodata, rodata_801C5E00]  # effect id
      - [0x4, c, bossde_801C5E04]
      - [0x1fec, data, data_801C7DEC]
  - [0x2800]
