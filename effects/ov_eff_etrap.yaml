name: OV_EFF_ETRAP
# Battle effect program etrap.prg (dev name from the Radical Dreamers Edition), disc file
# #4914. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x28).
# The same bytes are also files #4917, #4920, #4923, #4926, #4929. Generated by tools/mkeffects.py.
sha1: e172e455abc8023140bd093374e9f04cad85ce7d
options:
  basename: ov_eff_etrap
  target_path: iso/files/4914.bin
  elf_path: build/ov_eff_etrap.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_etrap
  src_path: src/ov_eff_etrap
  build_path: build

  ld_script_path: linker_scripts/ov_eff_etrap.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_etrap_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_etrap_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_etrap
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, rodata, rodata_801C5E00]  # effect id
      - [0x4, c, etrap_801C5E04]
      - [0x35c, data, data_801C615C]
  - [0x1000]
