name: OV_EFF_GHOST2
# Battle effect program ghost2.prg (dev name from the Radical Dreamers Edition), disc file
# #5229. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x77).
# The same bytes are also files #5241, #5250, #5253, #5904. Generated by tools/mkeffects.py.
sha1: 5e876d68cd239eb464c51586eedff4d02b841bea
options:
  basename: ov_eff_ghost2
  target_path: iso/files/5229.bin
  elf_path: build/ov_eff_ghost2.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_ghost2
  src_path: src/ov_eff_ghost2
  build_path: build

  ld_script_path: linker_scripts/ov_eff_ghost2.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_ghost2_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_ghost2_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_ghost2
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, rodata, rodata_801C5E00]  # effect id
      - [0x4, c, ghost2_801C5E04]
      - [0x5364, data, data_801CB164]
  - [0x5800]
