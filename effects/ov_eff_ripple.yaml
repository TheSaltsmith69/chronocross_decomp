name: OV_EFF_RIPPLE
# Battle effect program ripple.prg (dev name from the Radical Dreamers Edition), disc file
# #4347. Loaded into the effect slot at 0x801C5E00; the first word is the effect id
# (0x57).
# The same bytes are also files #5946. Generated by tools/mkeffects.py.
sha1: 5fe1a97e06e05bccc03e452b1fdcca14aa6cb309
options:
  basename: ov_eff_ripple
  target_path: iso/files/4347.bin
  elf_path: build/ov_eff_ripple.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_eff_ripple
  src_path: src/ov_eff_ripple
  build_path: build

  ld_script_path: linker_scripts/ov_eff_ripple.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".data", ".text", ".rodata", ".bss"]

  # Main-EXE symbols, so calls into main get the same names.
  symbol_addrs_path:
    - symbol_addrs.txt

  undefined_funcs_auto_path: linker_scripts/ov_eff_ripple_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_eff_ripple_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_eff_ripple
    type: code
    start: 0x0
    vram: 0x801C5E00
    subsegments:
      - [0x0, data, data_801C5E00]  # effect id
      - [0x4, c, ripple_801C5E04]
      - [0x2adc, .rodata, ripple_801C5E04]
  - [0x5000]
