name: OV_ENCT
# Disc file #7 (LBA 593, 14 sectors; #2538 is a copy): a battle effect module,
# going by its "c:\work\cdrom\battle\effects\enct.prd" path string probably the
# encounter transition. Loaded at 0x801EE000 while the battle engine (file #5)
# is in slot A; it calls battle and main-EXE functions.
# Extract it with: tools/extract_files.py <disc1.bin> iso/files 7
sha1: 915042e00a30849a789682832e8fef7ceab3abc9
options:
  basename: ov_enct
  target_path: iso/files/0007.bin
  elf_path: build/ov_enct.elf
  base_path: .
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_enct
  src_path: src/ov_enct
  build_path: build

  ld_script_path: linker_scripts/ov_enct.ld
  ld_dependencies: True
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  find_file_boundaries: True
  gp_value: 0x8006CE1C

  o_as_suffix: True
  use_legacy_include_asm: False

  # code first, then rodata (strings + jump tables), then data
  section_order: [".text", ".rodata", ".data", ".bss"]

  # Main-EXE symbols (so calls into main get the same names), plus our own.
  symbol_addrs_path:
    - symbol_addrs.txt
    - symbol_addrs_ov_enct.txt

  undefined_funcs_auto_path: linker_scripts/ov_enct_undefined_funcs_auto.txt
  undefined_syms_auto_path: linker_scripts/ov_enct_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: ov_enct
    type: code
    start: 0x0
    vram: 0x801EE000
    subsegments:
      - [0x0, c, enct_801EE000]
      # a jump table and the enct.prd path string
      - [0x5034, .rodata, enct_801EE000]
      - [0x5074, data, data_801F3074]
  - [0x7000]
